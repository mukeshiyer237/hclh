name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # SonarCloud needs full git history for blame & new-code detection

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, test, coverage & SonarCloud
        run: |
          mvn clean verify sonar:sonar -B \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=${{ github.workspace }}/target/site/jacoco/jacoco.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_URL: jdbc:h2:mem:ci
          DB_USERNAME: sa
          DB_PASSWORD: ""
          JWT_SECRET: ci-secret-key-must-be-at-least-32-chars
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          KAFKA_SECURITY_PROTOCOL: PLAINTEXT
          KAFKA_SASL_MECHANISM: ""
          KAFKA_SASL_JAAS_CONFIG: ""
          SPRING_PROFILES_ACTIVE: test
